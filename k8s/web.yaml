apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: karyakram-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
# Fixed at 30080 to match k8s/kind-config.yaml's port mapping. See docs/08-kubernetes.md.
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: NodePort
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
